# conditional-tasks — devnet-профиль.
crown_index   = "aaaaa-aa"                # principal crown-indexer (для пруфов); подаётся через init
# Имя threshold-ключа — свойство **окружения**, не признак «настоящести»: `key_1`
# и локально (сеть dfx сама работает на PocketIC), и на IC mainnet; `test_key_1` —
# только на тестовом сабнете IC. Стоявший здесь `dfx_test_key` не заводится ни в
# одном из трёх, и именно он, а не отсутствие возможности, был «блокером» подписи.
threshold_key = "key_1"                   # threshold Ed25519
voting_period = 120                       # devnet; вшивается в task_id
min_gross     = 250_000   # devnet: чуть выше пыльного флора индекса ($0.20), чтобы прогон стоил центы; экономический флор — в mainnet-профиле (cost.md §5,§6)
sign_price    = 26_200_000_000            # цена подписи (≤ релейного SIGN_PRICE); cost-gate P8
root_price    = 1_000_000_000             # цена обновления корня (BLS-пары сертификата); cost-gate P8
fee_bps       = 300                       # 3%
fee_wallet    = "FS6ZNuPxXqWSGzwXEQpfoxikDksbEzmrXGZDFXmFj6vS"  # devnet-кошелёк комиссии

[[chain]]
id      = "devnet"
factory = "BGVQrwSwkFQspL69DjGBFgKSgL6rutPqgcgEskmi8A4y"  # two-outcome на devnet
domain  = "crown:two-outcome:devnet"
