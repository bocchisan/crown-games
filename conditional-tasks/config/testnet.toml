# conditional-tasks — devnet-профиль.
crown_index   = "aaaaa-aa"                # principal crown-indexer (для пруфов); реальный — на P8/T5-прогоне
threshold_key = "dfx_test_key"            # threshold Ed25519 (devnet)
voting_period = 120                       # devnet; вшивается в task_id
min_gross     = 1_860_000                 # ≥ индексного MIN_GROSS (алайнмент)
sign_price    = 26_200_000_000            # цена подписи (≤ релейного SIGN_PRICE); cost-gate P8
fee_bps       = 300                       # 3%
fee_wallet    = "PLACEHOLDER_fee_wallet"  # реальный — на P8/T5-прогоне

[[chain]]
id      = "devnet"
factory = "PLACEHOLDER_factory_two_outcome"  # реальный — на P8/T5-прогоне
domain  = "crown:two-outcome:devnet"
