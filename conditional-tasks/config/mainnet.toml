# conditional-tasks — mainnet-профиль.
crown_index   = "PLACEHOLDER_indexer_mainnet_principal"
threshold_key = "key_1"                   # threshold Ed25519 (mainnet)
voting_period = 3600                      # mainnet; вшивается в task_id
# Флор = break_even × (1 + MARGIN), MARGIN = 0.20 (`cost.md §5`), пересчитан на
# **измеренных** ценах 2026-07-31: `cost = 2g + s` = 2·$0.009618 + $0.035737 =
# $0.054974 → be $1.8325 → флор $2.199 → 2_200_000. Прежние 1_860_000 считались
# по `g = 3.97e9`; настоящая цена вписи оказалась 7.04e9, и на ней старый флор
# давал маржу +1.5%, а с любым голосованием (V≥30) уходил ниже break-even.
# Тяжёлый член здесь — подпись ($0.0357): у задания она не амортизируется
# (`B=1`), поэтому флор задания структурно самый высокий из игр.
min_gross     = 2_200_000                 # ≥ индексного MIN_GROSS (и ≥ be×1.2)
sign_price    = 35_800_000_000            # цена подписи (≤ релейного SIGN_PRICE); cost-gate P8
root_price    = 1_400_000_000             # цена обновления корня (BLS-пары сертификата); cost-gate P8
fee_bps       = 300
fee_wallet    = "PLACEHOLDER_fee_wallet"

[[chain]]
id      = "mainnet"
factory = "PLACEHOLDER_factory_two_outcome"
domain  = "crown:two-outcome:mainnet"
