name: ci

on: [push, pull_request]

jobs:
  border:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # subscription — использование формы stream БЕЗ канистры/резолвера:
      # в репе не должно быть ic-cdk/threshold-подписи/резолвера.
      - name: form-usage only (no canister, no resolver)
        run: |
          ! grep -rnwE 'ic_cdk|sign_with_schnorr|resolver' --include='*.rs' . 2>/dev/null
