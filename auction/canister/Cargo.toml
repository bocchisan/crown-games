[package]
name = "auction"
version = "0.1.0"
edition = "2021"
description = "auction — аукцион (канистра ICP), форма two-outcome"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
serde = "1"             # #[serde]/Deserialize на candid-типах эндпоинтов
ic-cdk = "0.20"
auction-logic = { path = "../logic" }
crown-games-common = { path = "../../common" }  # общая деликатная крипта: пруф рождения (BLS), threshold-резолвер, PDA-адрес, кошельковая подпись
sha2 = "0.10"           # auction_id/lot_id = sha256(поля области)
bs58 = "0.5"            # encode резолвера/адресов
hex = "0.4"             # hex(auction_id/lot_id/text_hash) в сообщениях
ic-cdk-management-canister = "0.1"  # schnorr_public_key: bootstrap мастер-ключа резолвера

[build-dependencies]
bs58 = "0.5"  # base58 → [u8;32] адресов (fee_wallet, factory) из config/ при сборке

[dev-dependencies]
ed25519-dalek = "2"       # SigningKey/Signer в тестах протокола и состояния
pocket-ic = "13"          # эндпоинт-харнесс: install + прокси с циклами (request_signature)
candid = "0.10"
bs58 = "0.5"              # валидный base58-escrow для NotFound-пути request_signature
