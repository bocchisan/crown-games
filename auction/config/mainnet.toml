# auction — mainnet-профиль.
crown_index   = "PLACEHOLDER_indexer_mainnet_principal"
threshold_key = "key_1"
# Платформенный флор вклада. Резолвер у аукциона — **на вкладе** (`P7.8`), поэтому
# подпись не амортизируется и структура совпадает с заданием: `2g + s`, be $1.8325,
# флор ×1.2 = $2.199. Пересчитан на измеренных ценах `P7.22` (прежние 1_860_000
# считались по `g = 3.97e9`). Аукцион вне первого релиза, но конфиг mainnet ждёт
# своего дня заряженным — оставлять в нём убыточное число незачем.
min_entry      = 2_200_000
sign_price     = 35_800_000_000             # цена подписи вклада (harness §5; ≤ релейного SIGN_PRICE)
root_price     = 1_400_000_000              # цена обновления корня индекса (BLS-пары сертификата); cost-gate P8
slot_ms        = 400                        # 1000/SLOTS_PER_SECOND (SLOTS_PER_SECOND=2.5)
genesis_slot   = 0                          # якорь slot→unix — заполнить на P8 (freeze-gate: genesis_unix≠0)
genesis_unix   = 0                          # якорь slot→unix — заполнить на P8 (freeze-gate: genesis_unix≠0)

[[chain]]
id         = "mainnet"
factory    = "PLACEHOLDER_factory_two_outcome"
domain     = "crown:two-outcome:mainnet"
fee_bps    = 300
fee_wallet = "PLACEHOLDER_fee_wallet"
