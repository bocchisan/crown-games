# Test fixture — NOT a game component. Stands in for the relay: an inter-canister
# caller that attaches cycles to `request_signature` (ingress cannot attach cycles,
# so the paid-pull invariants are unreachable from a direct call). Detached from the
# auction workspace via an empty `[workspace]` so it builds standalone by manifest.
[package]
name = "relay-proxy"
version = "0.1.0"
edition = "2021"
description = "test fixture: attaches cycles to an inter-canister request_signature call"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.20"

[workspace]
