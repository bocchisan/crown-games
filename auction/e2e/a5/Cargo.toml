# auction A5 — live devnet e2e. Standalone (empty `[workspace]`) so it builds by
# manifest against the deployed devnet programs and a local PocketIC.
[package]
name = "auction-a5"
version = "0.1.0"
edition = "2021"
description = "auction A5: live devnet e2e (real escrows → real vote weight → real verdict signatures → real claim/refund)"

[[bin]]
name = "auction-a5"
path = "src/main.rs"

[dependencies]
auction = { path = "../../canister" }
crown-salt = { path = "../../../../crown-factory/salt" }
crown-derive = { path = "../../../../crown-factory/derive" }
two-outcome = { path = "../../../../crown-factory/shapes/two-outcome/solana", features = ["no-entrypoint"] }
# The reputation a vote weighs is bought the only way the system allows: a real
# settlement through the delimiter, folded from chain by the index.
splitter = { path = "../../../../crown-splitter/programs/splitter", features = ["no-entrypoint"] }
pocket-ic = "9"
candid = "0.10"
ed25519-dalek = "2"
anchor-lang = "0.31.1"
solana-sdk = "2.3"
solana-client = "2.3"
solana-transaction-status = "2.3"
spl-token = "7"
spl-associated-token-account = "6"
bs58 = "0.5"
hex = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[workspace]
