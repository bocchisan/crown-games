name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      # Border (games-harness §2): игра не ходит наружу (в т.ч. финал —
      # пруф рождения, не getAccountInfo).
      - name: no outbound (no SOL RPC / http outcall)
        run: |
          ! grep -rnE 'http_request|SolRpc|sol_rpc|management_canister::.*http' canister/src

      # Border (games-harness §3): без таймеров/поллинга (финал — pull-пагинация).
      - name: no timers
        run: |
          ! grep -rnE 'set_timer|canister_global_timer|ic_cdk_timers' canister/src
