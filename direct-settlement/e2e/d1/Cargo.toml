# direct-settlement D1 — live devnet e2e. Standalone (empty `[workspace]`) so it
# builds by manifest against the deployed devnet splitter and a local PocketIC.
#
# No game canister is installed and none exists: what this run proves is that a
# donation is two instructions and a submitter rule, and that the book credits the
# **net** (`docs/spec.md`). The index is real; only the RPC transport is mocked.
[package]
name = "direct-settlement-d1"
version = "0.1.0"
edition = "2021"
description = "direct-settlement D1: live devnet e2e (one two-instruction donation → fee to us, net through the splitter → reputation to the donor)"

[[bin]]
name = "direct-settlement-d1"
path = "src/main.rs"

[dependencies]
# The arithmetic under test: the client's quote and the submitter's rule, the two
# readings that must agree (`logic/src/lib.rs`).
direct-settlement-logic = { path = "../../logic" }
# The deployed delimiter — `donate` and its pinned USDC mint, byte-for-byte.
splitter = { path = "../../../../crown-splitter/programs/splitter", features = ["no-entrypoint"] }
pocket-ic = "9"
candid = "0.10"
anchor-lang = "0.31.1"
solana-sdk = "2.3"
solana-client = "2.3"
solana-transaction-status = "2.3"
spl-token = "7"
spl-associated-token-account = "6"
bs58 = "0.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[workspace]
