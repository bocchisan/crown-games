[package]
name = "conditional-funding"
version = "0.1.0"
edition = "2021"
description = "conditional-funding — краудфандинг-сбор (канистра ICP), форма two-outcome"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
serde = "1"
ic-cdk = "0.20"
conditional-funding-logic = { path = "../logic" }
crown-games-common = { path = "../../common" }  # общая деликатная крипта: пруф рождения (BLS), threshold-резолвер, PDA-адрес, кошельковая подпись
sha2 = "0.10"           # collection_id = sha256(поля области)
bs58 = "0.5"            # encode резолвера/адресов
hex = "0.4"             # hex(collection_id) в сообщениях
ic-cdk-management-canister = "0.1"  # schnorr_public_key: bootstrap мастер-ключа резолвера

[build-dependencies]
# Чтение config/<profile>.toml на бейке: один формат и один способ его читать
# на все игры (P7.6). Base58-декод адресов — там же.
crown-games-common = { path = "../../common" }

[dev-dependencies]
ed25519-dalek = "2"       # SigningKey/Signer в тестах протокола и состояния
pocket-ic = "13"          # BLS-цепочка против реального сертификата индекса
candid = "0.10"
bs58 = "0.5"              # валидный base58 в путях NotDecided/донора
# full-e2e (F5): мок SOL_RPC → index.ingest → пруф рождения → create → Signed.
# (candid-типы getTransaction скопированы в тест, чтобы не линковать канистру индекса)
crown-derive = { path = "../../../crown-factory/derive" }  # PDA эскроу (тот же, что индекс)
solana-sdk = "2.3"        # Message/Transaction wire-формат для мок-tx
bincode = "1"             # сериализация Transaction (как ждёт parse_message)
sha2 = "0.10"             # anchor-дискриминатор create_escrow
crown-salt = { path = "../../../crown-factory/salt" }  # two_outcome соль эскроу (адрес рождения)
hex = "0.4"               # hex(cert/witness) в запросе
