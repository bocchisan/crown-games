# conditional-funding — mainnet-профиль.
crown_index        = "PLACEHOLDER_indexer_mainnet_principal"
threshold_key      = "key_1"
voting_period      = 3600                   # mainnet; в прообразе collection_id
approval_threshold = 5000
quorum_weight      = 1_000_000
min_gross          = 410_000               # флор вклада (cost.md §5, Funding $0.41 = be·1.2); cost-gate P8
sign_price         = 35_800_000_000         # цена подписи сбора (harness §5; ≤ релейного SIGN_PRICE), амортизируется на N вкладов
root_price         = 1_400_000_000          # цена обновления корня индекса (BLS-пары сертификата); cost-gate P8
slot_ms            = 400                     # 1000/SLOTS_PER_SECOND (SLOTS_PER_SECOND=2.5)
# Якорь slot→unix, замерен на Solana mainnet **2026-07-31** (`solana block-time`
# на финализованном слоте). Это расходник, а не константа: сеть идёт примерно на
# 33 мс/слот впереди модели, то есть `created_at` набирает ~2 часа опережения в
# сутки. Направление безопасное (окно шире, не уже), но якорь живёт около
# недели-полутора. Деплой сдвинулся на месяц и больше — **перемерить**, иначе
# правило дедлайна начнёт требовать эскроу, которые никто не станет фондировать.
genesis_slot       = 436_339_325
genesis_unix       = 1_785_493_575

[[chain]]
id         = "mainnet"
factory    = "PLACEHOLDER_factory_two_outcome"
domain     = "crown:two-outcome:mainnet"
fee_bps    = 300
fee_wallet = "PLACEHOLDER_fee_wallet"
