# conditional-funding — mainnet-профиль.
crown_index        = "PLACEHOLDER_indexer_mainnet_principal"
threshold_key      = "key_1"
voting_period      = 3600                   # mainnet; в прообразе collection_id
approval_threshold = 5000
quorum_weight      = 1_000_000
# Флор вклада. Принцип `cost.md §5` — считать по **худшему** случаю: у сбора это
# `N = 1` (один вклад), и тогда его структура тождественна заданию — `2g + s`,
# be $1.8325, флор ×1.2 = $2.199. Прежние 410_000 брались из амортизированного
# примера (N=10) и на старой цене вписи; `cost.md §6` уже числил это расхождение
# принципа и примера как открытый вход cost-gate. Пересчёт на измеренных ценах
# закрывает вопрос в пользу принципа: на `g = 7.04e9` число $0.41 ниже
# break-even при **любом** N — даже асимптота (N,K→∞, остаётся неамортизируемое
# рождение `g`) даёт флор $0.385, а N=10,K=5 требует $0.607, N=50,K=10 — $0.453.
#
# Опустить флор — осознанная субсидия, а не экономия: при флоре F и структуре
# (N,K) платформа доплачивает `cost(N,K) − 0.03·F` за расчёт. Менять здесь одной
# строкой, но помнить, что это решение про продукт (какой минимальный вклад
# имеет смысл), а не про модель.
min_gross          = 2_200_000             # be($1.8325 при N=1) × 1.20; см. разбор выше
sign_price         = 35_800_000_000         # цена подписи сбора (harness §5; ≤ релейного SIGN_PRICE), амортизируется на N вкладов
root_price         = 1_400_000_000          # цена обновления корня индекса (BLS-пары сертификата); cost-gate P8
# Наклон модели slot→unix. **Не 400.** Замер mainnet 2026-07-31 на трёх базах
# (200k / 1M / 5M слотов): 421.8 / 421.9 / 416.3 мс на слот — сеть идёт медленнее
# номинальных 400, а не быстрее. С наклоном 400 модель отстаёт от реального
# времени на ~1.2 ч за сутки, и отстаёт в **опасную** сторону: `created_at`
# выходит раньше настоящего рождения, поэтому (1) окно сбора закрывается раньше
# заказанного и (2) `validate_registration` требует меньший `deadline`, съедая
# 72-часовой margin. Через ~2 месяца дрейфа margin съеден целиком, и ончейн-
# `refund()` открывается **до** конца голосования — вклады можно забрать до
# вердикта. Прежняя запись «направление дрейфа безопасное (окно шире)» верна для
# devnet (там сеть быстрее 400) и на mainnet неверна.
#
# Поэтому наклон берётся **выше** измеренного: 430 > 421.9. Тогда `created_at`
# выходит позже настоящего, то есть окно шире, а требуемый `deadline` строже —
# ошибка уходит в безопасную сторону, и якорь живёт не неделю, а месяцы.
# Перемерять на cost-gate тем же способом (`getBlockTime` на двух слотах).
slot_ms            = 430                     # замер 2026-07-31: 416–422 мс; берём с запасом вверх
# Якорь slot→unix, замерен на Solana mainnet **2026-07-31** (`solana block-time`
# на финализованном слоте). Это расходник, а не константа: якорь и наклон стареют
# вместе, и перемерять их надо одним замером. Запас держит **наклон** (430 против
# измеренных 416–422, разбор выше), а не якорь: пока наклон выше настоящего,
# `created_at` уходит позже реального рождения и ошибка лежит в безопасную
# сторону. Прежняя запись здесь — «сеть идёт на 33 мс/слот впереди модели,
# направление безопасное» — считала от наклона 400 и на mainnet неверна; она
# снята замером `P7.22`, а не переписана мнением. Деплой сдвинулся на месяц и
# больше — **перемерить оба числа**, иначе правило дедлайна начнёт требовать
# эскроу, которые никто не станет фондировать.
genesis_slot       = 436_339_325
genesis_unix       = 1_785_493_575

[[chain]]
id         = "mainnet"
factory    = "PLACEHOLDER_factory_two_outcome"
domain     = "crown:two-outcome:mainnet"
fee_bps    = 300
fee_wallet = "PLACEHOLDER_fee_wallet"
